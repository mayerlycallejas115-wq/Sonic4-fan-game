<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic 4 Fan Game Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style> 
        body { margin: 0; background: #87CEEB; overflow: hidden; touch-action: none; } 
        canvas { display: block; margin: 0 auto; } 
        .btn { position: absolute; bottom: 30px; width: 70px; height: 70px; background: rgba(255,255,255,0.4); border-radius: 50%; border: 3px solid white; font-size: 35px; color: white; font-weight: bold; user-select: none; }
        #left { left: 20px; }
        #right { left: 100px; }
        #jump { right: 100px; background: rgba(255,0,0,0.4); }
        #attack { right: 20px; background: rgba(0,0,255,0.4); }
    </style>
</head>
<body>
<button class="btn" id="left">◀</button>
<button class="btn" id="right">▶</button>
<button class="btn" id="jump">A</button>
<button class="btn" id="attack">B</button>

<script>
window.onload = function() {
const config = {
    type: Phaser.AUTO, 
    width: 800, 
    height: 450,
    backgroundColor: '#87CEEB',
    physics: { 
        default: 'arcade', 
        arcade: { gravity: { y: 1000 }, debug: false }
    },
    scene: { preload, create, update }
};

let player, rings, ringCount = 0, ringText, enemies, ground;
let moveLeft = false, moveRight = false, jumpPressed = false, attackPressed = false;

new Phaser.Game(config);

function preload(){}

function create(){
    ground = this.physics.add.staticGroup();
    ground.create(400, 440, null).setScale(20,1).refreshBody();
    ground.create(300, 380, null).setScale(4,0.5).refreshBody();
    
    player = this.physics.add.rectangle(100, 350, 25, 35, 0x0066ff);
    player.setCollideWorldBounds(true);
    this.physics.add.collider(player, ground);
    
    rings = this.physics.add.group();
    for(let i=0; i<20; i++){ 
        rings.create(200 + i*30, 360, null).setCircle(8).setTint(0xffff00); 
    }
    this.physics.add.overlap(player, rings, (p,r)=>{
        r.destroy(); 
        ringCount++; 
        ringText.setText('Rings: '+ringCount);
    }, null, this);
    
    enemies = this.physics.add.group();
    enemies.create(500, 360, null).setRectangle(20,20).setTint(0xff0000);
    this.physics.add.collider(enemies, ground);
    
    ringText = this.add.text(16,16,'Rings: 0',{fontSize:'24px',fill:'#000'}).setScrollFactor(0);
    this.cameras.main.startFollow(player);

    // CONTROLES TÁCTILES
    document.getElementById('left').addEventListener('touchstart', () => moveLeft = true);
    document.getElementById('left').addEventListener('touchend', () => moveLeft = false);
    document.getElementById('right').addEventListener('touchstart', () => moveRight = true);
    document.getElementById('right').addEventListener('touchend', () => moveRight = false);
    document.getElementById('jump').addEventListener('touchstart', () => jumpPressed = true);
    document.getElementById('jump').addEventListener('touchend', () => jumpPressed = false);
    document.getElementById('attack').addEventListener('touchstart', () => attackPressed = true);
    document.getElementById('attack').addEventListener('touchend', () => attackPressed = false);
}

function update(){
    if(moveLeft) player.setVelocityX(-300);
    else if(moveRight) player.setVelocityX(300);
    else player.setVelocityX(player.body.velocity.x * 0.8);
    
    if(jumpPressed && player.body.onFloor()){
        player.setVelocityY(-550);
        jumpPressed = false;
    }
    
    if(attackPressed && !player.body.onFloor()){
        let target = enemies.getChildren().find(e => Phaser.Math.Distance.Between(player.x,player.y,e.x,e.y) < 200);
        if(target) this.physics.moveToObject(player, target, 700);
        attackPressed = false;
    }
}
</script>
</body>
</html>
